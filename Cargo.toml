[workspace]
resolver = "2"
members = ["contracts/escrow", "contracts/mock-usdc"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
near-workspaces = "0.24.0"
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
proptest = "1.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
